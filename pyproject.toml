[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-station-agent"
version = "0.1.0"
description = "空压站多机协同智能调度 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1"]
frontend = []

[project.scripts]
air-station-pipeline = "air_station.data.pipeline:main"
air-station-baseline = "air_station.baseline.pipeline:main"
air-station-api = "air_station.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
