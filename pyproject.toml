[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-station-agent"
version = "0.1.0"
description = "空压站多机协同智能调度 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1", "mcp>=1.0"]

[project.scripts]
air-station-pipeline = "air_station.data.pipeline:main"
air-station-forecast-train = "air_station.models.forecasting.train:main"
air-station-forecast-eval = "air_station.models.forecasting.evaluate:main"
air-station-health = "air_station.models.health.evaluate:main"
air-station-api = "air_station.api.app:run"
air-station-mcp = "air_station.mcp_servers.server:main"
air-station-agent = "air_station.agent.workflow:cli"
air-station-web = "air_station.webapp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
