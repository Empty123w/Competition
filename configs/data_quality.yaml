# =====================================================================
# 阶段 A0 配置 1/3: 数据质量与清洗口径
# - 所有路径均为相对仓库根目录，禁止绝对路径
# - 所有阈值集中于此，代码不得硬编码
# - 所有字段均标注单位
# =====================================================================

# ---- 路径(相对) ----
paths:
  raw_dir: data
  processed_dir: data/processed
  fixtures_dir: data/fixtures
  simulated_dir: data/simulated

# ---- 时间口径 ----
time:
  column: time
  unit: "datetime(本地时间, 无时区)"
  expected_freq_seconds: 60          # 单位: s
  expected_start: "2026-03-12 00:00:00"
  expected_end: "2026-09-12 00:00:00"
  n_rows_expected: 264961

# ---- 1. 无效列(整列无信息, 直接剔除) ----
invalid_columns:
  - name: "4#B相电流"
    unit: "A"
    reason: "整列恒为 0, 传感器未采集"
    action: drop
  - name: "5#B相电流"
    unit: "A"
    reason: "整列恒为 0, 传感器未采集"
    action: drop
  - name: "大气压"
    unit: "MPa"
    reason: "恒为 0.101325, 常量无信息"
    action: drop

# ---- 2. 哨兵值(溢出占位, 置 NaN) ----
sentinels:
  - value: 65535
    meaning: uint16_overflow
    unit: "h"
    columns: ["4#总运行时间", "4#总负载时间"]
    action: to_nan
  - value: 4294970000
    meaning: uint32_overflow
    unit: "h"
    columns: ["4#下次保养剩余时间"]
    action: to_nan

# ---- 3. 有效运行状态 ----
running_state:
  status_column_map: { 4: "4#状态", 5: "5#状态" }
  running_code: 8                    # 开启
  stopped_code: 10                   # 关闭
  valid_codes: [0, 8, 10]            # 其余枚举值视为噪声
  power_threshold_kw: 1.0            # 单位 kW, 功率>该值判定为运行
  derived_flag: "运行"               # 派生布尔标志后缀, 如 4#运行

# ---- 4. 可插值最大缺口与已知缺测 ----
missing:
  max_interpolate_gap_minutes: 30    # 单位 min, 超过则不插值
  gap_action: "超限缺口置 NaN 并打标记 miss_ 前缀"
  flag_prefix: "miss_"
  known_gaps:
    - columns: ["4#中冷入口温度1", "5#中冷入口温度1", "4#中冷出口温度1", "5#中冷出口温度1",
                "4#后冷入口温度1", "5#后冷入口温度1", "4#后冷出口温度1", "5#后冷出口温度1"]
      unit: "℃"
      start: "2026-03-12 00:00:00"
      end: "2026-03-17 23:59:00"
      reason: "前 6 天传感器未投运, 连续缺测(3.3%~4.9%)"
  zero_dropout:
    columns: ["站房温度", "站房湿度"]
    units: { "站房温度": "℃", "站房湿度": "%RH" }
    method: ffill
    reason: "0 视为掉点(温度 58 行/湿度 56 行)"

# ---- 5. 单位与单位转换 ----
# raw 为原始单位; canonical 为工程内部统一单位; factor 为 multiplier(raw -> canonical)
unit_conversions:
  - quantity: 压力
    raw_unit: MPa
    canonical_unit: MPa
    factor: 1.0
    fields: ["排气压力", "母管压力", "变速箱油压", "压差", "额定压力_MPa"]
  - quantity: 压差
    raw_unit: kPa
    canonical_unit: kPa
    factor: 1.0
    fields: ["油滤器压差"]
  - quantity: 压降
    raw_unit: Pa
    canonical_unit: Pa
    factor: 1.0
    fields: ["空气过滤器压降"]
  - quantity: 流量
    raw_unit: "m3/min"
    canonical_unit: "m3/min"
    factor: 1.0
    fields: ["实时流量", "支路流量", "总流量"]
  - quantity: 功率
    raw_unit: kW
    canonical_unit: kW
    factor: 1.0
    fields: ["功率", "额定功率_kW"]
  - quantity: 电流
    raw_unit: A
    canonical_unit: A
    factor: 1.0
    fields: ["A相电流", "C相电流"]
  - quantity: 开度
    raw_unit: "%"
    canonical_unit: "%"
    factor: 1.0
    fields: ["IGV开度", "BOV闭度"]
  - quantity: 温度
    raw_unit: "℃"
    canonical_unit: "℃"
    factor: 1.0
    fields: ["排气温度", "油箱油温", "电机温度", "站房温度"]
  - quantity: 湿度
    raw_unit: "%RH"
    canonical_unit: "%RH"
    factor: 1.0
    fields: ["站房湿度"]
  - quantity: 振动
    raw_unit: "mm/s"
    canonical_unit: "mm/s"
    factor: 1.0
    fields: ["一级震动", "二级震动", "三级震动"]
  - quantity: 时间-累计
    raw_unit: "h"
    canonical_unit: "h"
    factor: 1.0
    fields: ["总运行时间", "总负载时间", "下次保养剩余时间"]
  - quantity: 比功率
    raw_unit: "kW/(m3/min)"
    canonical_unit: "kW/(m3/min)"
    factor: 1.0
    fields: ["比功率_kW_m3min"]

# ---- 数据来源标记方式(真实/推断/模拟) ----
data_origin:
  field: data_origin          # 每个规范化的记录/字段带此标记
  values:
    real: "直接来自主办方数据"
    inferred: "由真实字段计算或推断(派生表/运行状态/故障弱标签)"
    simulated: "模拟生成(喘振边界/RUL 等)"
  convention:
    table_level:
      "data/": real
      "data/simulated/": simulated
    column_level: "在标准字段清单的 origin 列标注"
    runtime: "代码通过本配置与字段清单判定, 不猜测"
