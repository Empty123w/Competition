# =====================================================================
# 预测性维护策略仿真配置 (阶段 A7, 混合方案)
#   真实主办方遥测作底 + 注入退化标签 + 趋势预警
# 目标(模拟闭环自证):
#   - 非计划停机次数下降率 >=50%
#   - MTBF 提升率 >=30%
#   - 异常预警准确率 >=90%
#   - 预警提前时间 >=24h
# =====================================================================

seed: 123
devices: [4, 5]
episodes_per_device: 120

data_mode: hybrid                 # hybrid = 真实轨迹 + 注入退化
hybrid:
  nodes_per_episode: 40           # 40 节点 x 6h = 240h
  k_vib: 1.2
  k_temp: 1.0
  temp_grow_c: 26.0
  oil_grow_c: 13.0
  current_grow_a: 8.0
  ufp_grow: 1.2
  normal_progress_max: 0.0       # 正常 episode 仅注入轻微上升(无失效)

warn_eval:
  target_accuracy: 0.90
  warn_grid: [3.0, 4.0, 5.0, 6.0, 8.0, 10.0, 12.0, 15.0]   # 趋势分数阈值

lead_target_hours: 24.0
baseline_policy: reactive
proposed_policy: trend_warning_planned_maintenance

paths:
  processed_dir: data/processed
  metrics: artifacts/metrics/maintenance_metrics.json
  report_dir: analysis/reports/phaseA7_maint

# 运行时维护预警接口(maintenance_json)
runtime:
  threshold: 12.0            # 由仿真网格选定的趋势分数阈值
  lookback_nodes: 24         # 在线看回窗口(24 x 6h = 144h)
  base_nodes: 8              # 窗口内用于基准的前段节点数
  suggest_warning: "振动/温度/电流趋势偏离基准, 建议安排计划性检查与保养"
  suggest_normal: "趋势平稳, 维持当前运行"
