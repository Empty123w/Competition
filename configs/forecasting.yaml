# =====================================================================
# 阶段 A0 配置 2/3: 用气负荷预测
# - 相对路径; 阈值/参数集中; 字段与单位齐全
# =====================================================================

# ---- 路径(相对) ----
paths:
  processed_dir: data/processed
  model_dir: artifacts/models
  metrics_dir: artifacts/metrics

# ---- 目标与预测时间范围 ----
target:
  column: "total_flow_m3_min"
  unit: "m3/min"
  source: "data/processed/station_timeseries.parquet"
  origin: inferred            # = 4#实时流量 + 5#实时流量

data_range:                   # 训练可用数据的时间范围
  start: "2026-03-12 00:00:00"
  end: "2026-09-12 00:00:00"

granularity: minute           # minute | hour
forecast:
  horizon_minutes: [15, 30, 60]     # 三个独立直接预测模型(min)
  step_minutes_default: 15          # 服务产出曲线的默认步长, 单位 min

# ---- 数据切分日期(时间范围) ----
split:
  train: { start: "2026-03-12 00:00:00", end: "2026-07-31 23:59:00" }
  valid: { start: "2026-08-01 00:00:00", end: "2026-08-20 23:59:00" }
  test:  { start: "2026-08-21 00:00:00", end: "2026-09-12 00:00:00" }

# ---- 特征 ----
features:
  calendar: [hour, weekday, month, is_workday]   # 无单位
  cycle_encoding: [hour_sin, hour_cos, weekday_sin, weekday_cos]  # 周期 sin/cos
  lags_minutes: [1, 5, 15, 30, 60, 1440]          # 历史负荷滞后(min); 可选周滞后 10080
  optional_lag_minutes: 10080
  rolling_minutes: [5, 15, 30, 60]                # 滚动窗口(min), 统计 mean/std/min/max
  diff_minutes: [1, 5, 15]                         # 变化率(min)
  ambient: [station_temperature_c, station_humidity_percent]   # ℃ / %RH
  extra: [header_pressure_mpa, running_count, load_level]      # MPa / 台 / 类别
  rolling_closed: left          # 滚动窗口左闭右开, 且先 shift(1)
  volatility_window_minutes: 15
  # 剔除会引发分布漂移/过拟合的原始站级测量(保留其可用代理, 如 ambient_* / 滚动量)
  exclude: [header_pressure_mpa, total_power_kw, load_rate,
            station_temperature_c, station_humidity_percent, environment_interpolated]

# ---- 模型参数 ----
model:
  type: lightgbm             # lightgbm | xgboost | hist_gbdt
  fallback: hist_gbdt        # 首选不可用时回退
  random_state: 42
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.7

# ---- 评价指标 ----
evaluate:
  metrics: [MAPE, MAE, RMSE, WAPE]
  units: { MAPE: "%", MAE: "m3/min", RMSE: "m3/min", WAPE: "%" }
  mape_epsilon: 1.0           # 单位 m3/min, 防分母为 0
  mape_min_flow_m3min: 1.0    # MAPE 仅在真实流量 >= 该门槛时统计
  target_mape_pct: 8.0        # 赛题要求 <= 8%
  baselines: [lag_1, ma_15, same_time_yesterday, same_time_last_week]
  seasonal_period_minutes: 1440   # 前一天同一时刻
  weekly_period_minutes: 10080    # 前一周同一时刻
  moving_average_window_minutes: 15
  confidence_level: 0.90      # 预测区间
  ci_lower_quantile: 0.05
  ci_upper_quantile: 0.95
