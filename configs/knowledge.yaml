# =====================================================================
# 知识库配置 (阶段 K)
# =====================================================================
knowledge_root: knowledge
artifact_dir: artifacts/knowledge

retrieval:
  mode: tfidf_char
  ngram_range: [2, 4]
  top_k: 5
  # min_score 由标准问题集阈值网格选定, 见 analysis/reports/phaseK/knowledge_acceptance.json
  min_score: 0.11

answer:
  max_citations: 5
  no_answer_text: "知识库暂无可靠依据，请检查项目文档或补充知识来源。"

# 指标知识卡真源(构建时读取当前值, 变化则标记 stale)
metrics_sources:
  forecast: artifacts/metrics/forecast_metrics.json
  forecast_rolling: artifacts/metrics/forecast_rolling_metrics.json
  health: artifacts/metrics/health_metrics.json
  rul: artifacts/metrics/rul_metrics.json
  maintenance: artifacts/metrics/maintenance_metrics.json
